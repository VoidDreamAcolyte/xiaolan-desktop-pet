<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!--
    内容安全策略（CSP）：
      - default-src 'none'：默认什么都不许加载
      - img-src 'self' data:：只允许本地图片
      - media-src blob:：只允许播放页面内用 Blob 生成的音频（TTS 字节 → ObjectURL 兜底），
        仍然不允许任何网络音频；connect-src 'none' 也继续拦死 fetch / XHR / WebSocket
      - style-src 'self' 'unsafe-inline'：本地 CSS 与行内样式（动画需要）
      - script-src 'self'：只允许本地脚本，禁止任何内联脚本与 eval
      - connect-src 'none'：本阶段不发起任何网络请求（云 API 全部走主进程 IPC）
    这样即使页面被注入内容，也无法加载远程资源或外发数据。
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; img-src 'self' data:; media-src blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'">
  <title>小蓝 · 桌宠</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!--
    桌宠舞台：窗口本身是透明无边框的，页面背景也必须完全透明，
    只有鱼本体（SVG）悬浮在桌面上。

    类名由 renderer.js 维护：
      state-*  当前可见状态（16 个动作状态之一）
      mode-*   当前持久模式（idle / hungry / angry / sleep）
      swim-*   游动朝向
    注意：这里【没有】任何可见文字气泡 —— 说话默认走语音（后续阶段），
    文字气泡只在"字幕模式"开启时才显示；本阶段连语音都还没有，所以不用文字冒充语音。
    页面只保留一个 .sr-only 的无障碍状态文本给读屏用。
  -->
  <main id="stage" class="stage" aria-label="小蓝 · 桌宠">
    <!-- 鱼本体：由 tools/build-renderer.js 从 assets/fish.svg 注入（保持 SVG 独立可编辑） -->
    <!-- FISH_SVG_START -->
    <svg id="fish-svg" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 360 340" role="img" aria-label="桌宠：蓝发小姑娘（形象由用户自定义图片替换）"><g id="fish-root"><g id="fish-action"><g id="body"><image id="pet-image" href="pet-girl.png" xlink:href="pet-girl.png" x="58" y="4" width="244" height="332" preserveAspectRatio="xMidYMid meet"/></g><g id="eyes" opacity="0" pointer-events="all"><rect x="118" y="18" width="124" height="126" fill="none" pointer-events="all"/></g><g id="zzz" opacity="0"><text class="z z1" x="246" y="96" font-size="22" font-weight="700" fill="#d6f0ff" stroke="#04203a" stroke-width="2" paint-order="stroke">Z</text><text class="z z2" x="266" y="74" font-size="17" font-weight="700" fill="#d6f0ff" stroke="#04203a" stroke-width="2" paint-order="stroke">Z</text><text class="z z3" x="282" y="56" font-size="13" font-weight="700" fill="#d6f0ff" stroke="#04203a" stroke-width="2" paint-order="stroke">Z</text></g><g id="sweat" opacity="0"><path d="M 288 96 c 0 0 12 16 12 24 a 12 12 0 0 1 -24 0 c 0 -8 12 -24 12 -24 z" fill="#8fd8ff" stroke="#2b7fb0" stroke-width="2.5"/></g><g id="think" opacity="0"><circle class="think-bubble tb1" cx="248" cy="110" r="8" fill="#d6f0ff" stroke="#04203a" stroke-width="2"/><circle class="think-bubble tb2" cx="268" cy="90" r="6" fill="#e8f8ff" stroke="#04203a" stroke-width="1.8"/><text class="think-mark" x="278" y="76" font-size="28" font-weight="700" fill="#eaf7ff" stroke="#04203a" stroke-width="2" paint-order="stroke">?</text></g><g id="angry-mark" opacity="0"><g transform="translate(300 74)"><path class="anger-line al1" d="M -13 -8 L -3 -2" fill="none" stroke="#ff5f5f" stroke-width="4.5" stroke-linecap="round"/><path class="anger-line al2" d="M 3 -13 L 9 -3" fill="none" stroke="#ff5f5f" stroke-width="4.5" stroke-linecap="round"/><path class="anger-line al3" d="M 13 8 L 3 2" fill="none" stroke="#ff5f5f" stroke-width="4.5" stroke-linecap="round"/><path class="anger-line al4" d="M -3 13 L -9 3" fill="none" stroke="#ff5f5f" stroke-width="4.5" stroke-linecap="round"/></g></g><g id="happy-bubbles" opacity="0"><circle class="bubble b1" cx="232" cy="118" r="9" fill="#8fd8ff"/><circle class="bubble b2" cx="258" cy="98" r="7" fill="#ffd9f0"/><circle class="bubble b3" cx="286" cy="122" r="6" fill="#fff3b0"/><circle class="bubble b4" cx="250" cy="138" r="5" fill="#b6f5d8"/><circle class="bubble b5" cx="302" cy="94" r="4" fill="#d9c7ff"/></g><g id="heart" opacity="0"><g transform="translate(300 60)"><path class="heart h1" d="M 0 6 C 0 -2 -10 -6 -14 0 C -18 -6 -28 -2 -28 6 C -28 16 -14 24 0 32 C 14 24 28 16 28 6 C 28 -2 18 -6 14 0 C 10 -6 0 -2 0 6 Z" fill="#ff7fa3" stroke="#c94f74" stroke-width="2"/></g><g transform="translate(332 92)"><path class="heart h2" d="M 0 4 C 0 -1 -6 -4 -9 0 C -12 -4 -18 -1 -18 4 C -18 10 -9 15 0 20 C 9 15 18 10 18 4 C 18 -1 12 -4 9 0 C 6 -4 0 -1 0 4 Z" fill="#ffa8c0" stroke="#c94f74" stroke-width="1.6"/></g></g><g id="hungry-mark" opacity="0"><path class="growl gr1" d="M 104 240 q 12 -10 24 0 q 12 10 24 0" fill="none" stroke="#bfe6ff" stroke-width="3.5" stroke-linecap="round"/><path class="growl gr2" d="M 118 260 q 10 -9 20 0 q 10 9 20 0" fill="none" stroke="#bfe6ff" stroke-width="3" stroke-linecap="round"/></g><g id="swim-trail" opacity="0"><circle class="trail t1" cx="66" cy="316" r="7" fill="#e9dcc6" opacity="0.85"/><circle class="trail t2" cx="88" cy="324" r="6" fill="#dfd0b6" opacity="0.8"/><circle class="trail t3" cx="74" cy="304" r="5" fill="#d3c2a4" opacity="0.75"/><circle class="trail t4" cx="98" cy="312" r="4.5" fill="#e5d7bf" opacity="0.7"/><circle class="exhaust e1" cx="46" cy="300" r="11" fill="#eceae4" opacity="0.75"/><circle class="exhaust e2" cx="30" cy="290" r="14" fill="#e2dfd7" opacity="0.6"/><circle class="exhaust e3" cx="16" cy="276" r="17" fill="#d8d5cc" opacity="0.45"/></g><g id="tap-fx" opacity="0" pointer-events="none"><g class="fx-burst"><circle r="17" fill="none" stroke="#ffd76e" stroke-width="3.5"/><g stroke="#ffb14e" stroke-width="3.5" stroke-linecap="round"><line x1="0" y1="-27" x2="0" y2="-19"/><line x1="24" y1="-8" x2="16" y2="-5"/><line x1="15" y1="20" x2="10" y2="14"/><line x1="-15" y1="20" x2="-10" y2="14"/><line x1="-24" y1="-8" x2="-16" y2="-5"/></g></g></g><g id="bowl" opacity="0"><g id="rice"><ellipse class="rice" cx="290" cy="234" rx="8" ry="5.5" fill="#ffffff" stroke="#d9d2c2" stroke-width="1"/><ellipse class="rice" cx="304" cy="232" rx="8" ry="5.5" fill="#ffffff" stroke="#d9d2c2" stroke-width="1"/><ellipse class="rice" cx="297" cy="225" rx="8" ry="5.5" fill="#ffffff" stroke="#d9d2c2" stroke-width="1"/><ellipse class="rice" cx="288" cy="223" rx="7" ry="5" fill="#ffffff" stroke="#d9d2c2" stroke-width="1"/><ellipse class="rice" cx="302" cy="222" rx="7" ry="5" fill="#ffffff" stroke="#d9d2c2" stroke-width="1"/></g><path d="M 272 236 h 52 a 26 21 0 0 1 -52 0 z" fill="#f4f8fb" stroke="#8fa6b6" stroke-width="2.5" stroke-linejoin="round"/><ellipse cx="298" cy="236" rx="26" ry="7" fill="none" stroke="#8fa6b6" stroke-width="2"/><g id="face" opacity="0" pointer-events="all"><rect x="134" y="148" width="92" height="56" fill="none" pointer-events="all"/></g><g id="belly" opacity="0" pointer-events="all"><rect x="150" y="210" width="60" height="44" fill="none" pointer-events="all"/></g><g id="hands" opacity="0" pointer-events="all"><rect x="118" y="210" width="36" height="34" fill="none" pointer-events="all"/><rect x="206" y="210" width="36" height="34" fill="none" pointer-events="all"/></g><g id="feet" opacity="0" pointer-events="all"><rect x="140" y="252" width="70" height="34" fill="none" pointer-events="all"/></g></g></g></g></svg>
    <!-- FISH_SVG_END -->

    <!--
      字幕 / 状态气泡（阶段 4）：
        - 默认**完全不可见**（`hidden` + `.bubble-hidden`）：需求要求"回复默认只走语音"，
          只有设置里打开「字幕模式」后才显示与语音**内容完全一致**的同一段文字；
        - 错误与麦克风状态提示允许默认显示（需求第 5 条），但都是轻量气泡，绝不弹错误窗；
        - 内容一律用 `textContent` 写入，绝不用 innerHTML，也不放任何远程资源。
    -->
    <div id="speech-bubble" class="bubble bubble-hidden" aria-hidden="true">
      <span id="speech-bubble-text" class="bubble-text"></span>
    </div>

    <!-- 无障碍 / 调试用：把当前状态写进 DOM（.sr-only，屏幕上看不见），
         只给读屏与人工排查用，不是台词气泡 -->
    <p id="a11y-status" class="sr-only" role="status" aria-live="polite"></p>
  </main>

  <!-- 纯逻辑模块（无 DOM 依赖，可被 node 单元测试直接 require）：先加载再启动渲染层 -->
  <script src="logic/state-machine.js"></script>
  <script src="logic/fullness.js"></script>
  <!-- 阶段 4：本地 VAD、WAV 编码、语音回合管理（同样是纯逻辑，假时钟可测） -->
  <script src="logic/vad.js"></script>
  <script src="logic/wav.js"></script>
  <script src="logic/turn-taking.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
